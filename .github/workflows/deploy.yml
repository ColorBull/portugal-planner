name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

      # The app as it stood before the 2026-09-20 changes, published under
      # /backup/ so the live app keeps its own URL. The branch is frozen.
      - uses: actions/checkout@v4
        with:
          ref: backup-2026-09-19
          path: backup-src
      - run: npm install --no-audit --no-fund
        working-directory: backup-src
      - run: npm run build
        working-directory: backup-src
      - run: mv backup-src/dist dist/backup

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
